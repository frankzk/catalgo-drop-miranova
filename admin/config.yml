# ============================================================================
# Configuración del panel de administración (Sveltia CMS)
# ----------------------------------------------------------------------------
# Edita SOLO la línea base_url si cambias el servicio de acceso (OAuth),
# y branch si cambias la rama de publicación. Lo demás ya está listo.
# ============================================================================

backend:
  name: github
  repo: frankzk/catalgo-drop-miranova
  branch: claude/new-session-pm108s
  # Servicio de acceso (OAuth). Reemplaza por la URL de tu worker de Cloudflare.
  # Ver: admin/SETUP.md  →  "Paso 2: Servicio de acceso".
  base_url: https://TU-AUTH.workers.dev

# Dónde se guardan las fotos en el repositorio y cómo se referencian en el sitio.
media_folder: "miranova/data/images"
public_folder: "data/images"

# Idioma del panel
locale: es

# Un grupo por país. Cada uno edita su archivo de productos.
collections:
  - name: honduras
    label: "🇭🇳 Honduras"
    files:
      - name: productos
        label: "Productos de Honduras"
        file: "miranova/data/honduras.json"
        format: json
        fields:
          - name: products
            label: "Productos"
            label_singular: "Producto"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Título", widget: string }
              - { name: description, label: "Descripción", widget: text, required: false }
              - name: category
                label: "Categoría"
                widget: select
                options:
                  - { label: "Suplementos", value: "suplementos" }
                  - { label: "Belleza", value: "belleza" }
                  - { label: "Hogar y cocina", value: "hogar" }
                  - { label: "Otros", value: "otros" }
              - { name: providerPrice, label: "Precio proveedor (L)", widget: number, value_type: float }
              - { name: suggestedPrice, label: "Precio sugerido (L)", widget: number, value_type: float }
              - { name: currency, label: "Moneda", widget: hidden, default: "HNL" }
              - { name: image, label: "Foto del producto", widget: image, required: false }

  - name: costa-rica
    label: "🇨🇷 Costa Rica"
    files:
      - name: productos
        label: "Productos de Costa Rica"
        file: "miranova/data/costa-rica.json"
        format: json
        fields:
          - name: products
            label: "Productos"
            label_singular: "Producto"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Título", widget: string }
              - { name: description, label: "Descripción", widget: text, required: false }
              - name: category
                label: "Categoría"
                widget: select
                options:
                  - { label: "Suplementos", value: "suplementos" }
                  - { label: "Belleza", value: "belleza" }
                  - { label: "Hogar y cocina", value: "hogar" }
                  - { label: "Otros", value: "otros" }
              - { name: providerPrice, label: "Precio proveedor (₡)", widget: number, value_type: float }
              - { name: suggestedPrice, label: "Precio sugerido (₡)", widget: number, value_type: float }
              - { name: currency, label: "Moneda", widget: hidden, default: "CRC" }
              - { name: image, label: "Foto del producto", widget: image, required: false }

  - name: guatemala
    label: "🇬🇹 Guatemala"
    files:
      - name: productos
        label: "Productos de Guatemala"
        file: "miranova/data/guatemala.json"
        format: json
        fields:
          - name: products
            label: "Productos"
            label_singular: "Producto"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Título", widget: string }
              - { name: description, label: "Descripción", widget: text, required: false }
              - name: category
                label: "Categoría"
                widget: select
                options:
                  - { label: "Suplementos", value: "suplementos" }
                  - { label: "Belleza", value: "belleza" }
                  - { label: "Hogar y cocina", value: "hogar" }
                  - { label: "Otros", value: "otros" }
              - { name: providerPrice, label: "Precio proveedor (Q)", widget: number, value_type: float }
              - { name: suggestedPrice, label: "Precio sugerido (Q)", widget: number, value_type: float }
              - { name: currency, label: "Moneda", widget: hidden, default: "GTQ" }
              - { name: image, label: "Foto del producto", widget: image, required: false }
