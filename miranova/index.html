<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="theme-color" content="#f6f7f9" />
  <title>Catálogo proveedor</title>
  <meta name="description" content="Catálogo proveedor / vitrina de dropshipping. Conecta cada producto en Boxville." />
  <link rel="stylesheet" href="../styles.css?v=6" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-avatar" id="brand-avatar"></div>
        <div class="brand-text">
          <div class="brand-name" id="brand-name">Catálogo</div>
          <div class="brand-sub" id="brand-sub"></div>
        </div>
      </div>

      <p class="headline" id="headline" hidden></p>

      <nav class="country-tabs" id="country-tabs" aria-label="País" hidden></nav>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Buscar productos…" autocomplete="off" />
      </div>

      <nav class="chips" id="chips" aria-label="Categorías"></nav>
    </div>
  </header>

  <main>
    <div class="status" id="status">
      <div class="spinner"></div>
      Cargando productos…
    </div>
    <section class="grid" id="grid" aria-live="polite"></section>
  </main>

  <footer>
    <span id="footer-note"></span>
  </footer>

  <!-- Botón flotante de WhatsApp (se muestra si config tiene whatsappNumber) -->
  <a class="wa-fab" id="wa-fab" hidden href="#" target="_blank" rel="noopener noreferrer" aria-label="Consultas por WhatsApp">
    <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16.04 4c-6.6 0-11.96 5.36-11.96 11.96 0 2.11.55 4.17 1.6 5.98L4 28l6.22-1.63a11.9 11.9 0 0 0 5.82 1.48h.01c6.6 0 11.96-5.36 11.96-11.96 0-3.2-1.25-6.2-3.5-8.46A11.9 11.9 0 0 0 16.04 4Zm0 21.86h-.01a9.9 9.9 0 0 1-5.04-1.38l-.36-.21-3.69.97.98-3.6-.24-.37a9.86 9.86 0 0 1-1.51-5.27c0-5.48 4.46-9.94 9.95-9.94 2.66 0 5.15 1.04 7.03 2.92a9.88 9.88 0 0 1 2.91 7.03c0 5.48-4.46 9.94-9.94 9.94Zm5.45-7.44c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51l-.57-.01c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.49 0 1.47 1.07 2.89 1.22 3.09.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.08 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35Z"/></svg>
    <span class="wa-label">Consultas</span>
  </a>

  <!-- Hoja de detalle (bottom sheet) -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detalle de producto" hidden>
    <div class="sheet-grabber"></div>
    <button class="sheet-close" id="sheet-close" aria-label="Cerrar">×</button>
    <div class="sheet-scroll" id="sheet-scroll">
      <div id="sheet-body"></div>
    </div>
  </aside>

  <script src="config.js?v=7"></script>
  <script src="../app.js?v=7"></script>
</body>
</html>
